<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Pagamento</title>
    <link rel="stylesheet" href="formaPagamento.css">
</head>

<body onload="inicializar()">
    <header>
        <h1>$~Cadastro de pagamento~$</h1>
        <p>Gerencie o seu pagamento.</p>
    </header>

    <main class="container-master">
        <div class="conteudo-principal">
            <section class="form-esquerda">
                <h2>Dados do Pagamento</h2>
                
                <label for="inputID_forma_pagamento">Forma de Pagamento</label>
                <div class="linha-id">
                    <input type="text" name="inputID_forma_pagamento" id="inputID_forma_pagamento" placeholder="Ex: 1">
                    <input type="button" value="Procure" id="btProcure" onclick="procure()">
                    <input type="button" value="Inserir" id="btInserir" onclick="inserir()" style="display:none;">
                    <input type="button" value="Alterar" id="btAlterar" onclick="alterar()" style="display:none;">
                    <input type="button" value="Excluir" id="btExcluir" onclick="excluir()" style="display:none;">
                </div>

                <label for="inputNome_forma_pagamento">Nome da forma de Pagamento</label>
                <input type="text" name="inputNome_forma_pagamento" id="inputNome_forma_pagamento" placeholder="Ex: Pix">

                    <option value="">Carregando...</option>
                </select>

                <div id="divAviso">Informe o ID e clique em Procure</div>

                <div class="botoes-acao">
                    <input type="button" value="Salvar" id="btSalvar" onclick="salvar()" style="display:none;">
                    <input type="button" value="Cancelar" id="btCancelar" onclick="cancelarOperacao()" style="display:none;">
                </div>
            </section>

        </div>

        <section class="lista-filmes">
            <h3>Pagamentos Cadastrados</h3>
            <div id="outputSaida">Carregando...</div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Sistema CRUD Pagamentos. Todos os direitos reservados.</p>
    </footer>

    <script src="./formaPagamento.js"></script>
</body>

</html>
